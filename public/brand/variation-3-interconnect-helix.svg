<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="100%" height="180">
  <defs>
    <linearGradient id="v3DarkWingTop" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0062FF" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <linearGradient id="v3DarkWingBtm" x1="100%" y1="100%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0062FF" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="760" height="180" rx="12" fill="#050B14" />

  <!-- Symbol: Interconnect Helix S -->
  <g transform="translate(68, 30)">
    <!-- Top Aerodynamic Wing -->
    <path d="M 12,50 C 12,22 36,8 68,8 C 104,8 116,28 116,42 C 116,56 94,62 76,68 L 38,58 C 22,54 12,50 12,50 Z" 
          fill="url(#v3DarkWingTop)" />

    <!-- Bottom Aerodynamic Wing -->
    <path d="M 112,70 C 112,98 88,112 56,112 C 20,112 8,92 8,78 C 8,64 30,58 48,52 L 86,62 C 102,66 112,70 112,70 Z" 
          fill="url(#v3DarkWingBtm)" />

    <!-- Diagonal Data Beam Negative Space -->
    <line x1="30" y1="92" x2="94" y2="28" stroke="#050B14" stroke-width="6" stroke-linecap="round" />
    <line x1="32" y1="90" x2="92" y2="30" stroke="#00F0FF" stroke-width="2" stroke-dasharray="4 6" opacity="0.7" />

    <!-- Terminal Nodes -->
    <circle cx="116" cy="42" r="4" fill="#FFFFFF" />
    <circle cx="8" cy="78" r="4" fill="#FFFFFF" />
  </g>

  <!-- Typography Lockup -->
  <text x="216" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="7.5" fill="#F8FAFC">
    STARTA
  </text>
  <text x="218" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="4.5" fill="#38BDF8">
    COMMUNICATION LTD
  </text>
  <circle cx="500" cy="118" r="3" fill="#0062FF" />
</svg>
