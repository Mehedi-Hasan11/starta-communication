<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="100%" height="180">
  <defs>
    <linearGradient id="v2DarkBeamTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0062FF" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="760" height="180" rx="12" fill="#050B14" />

  <!-- Symbol: Precision Pulse S -->
  <g transform="translate(65, 30)">
    <!-- Top Arc Path 1 (Inner Cyan) -->
    <path d="M 40,48 C 40,24 60,18 78,18 C 96,18 108,28 108,44 C 108,60 88,68 62,76" 
          fill="none" stroke="#00F0FF" stroke-width="7" stroke-linecap="round" />
    
    <!-- Top Arc Path 2 (Outer Electric Blue) -->
    <path d="M 24,48 C 24,14 52,6 80,6 C 108,6 122,22 122,42 C 122,66 98,76 76,84" 
          fill="none" stroke="#0062FF" stroke-width="7" stroke-linecap="round" opacity="0.85" />

    <!-- Bottom Counter-Arc 1 (Inner Electric Blue) -->
    <path d="M 88,72 C 88,96 68,102 50,102 C 32,102 20,92 20,76 C 20,60 40,52 66,44" 
          fill="none" stroke="#0062FF" stroke-width="7" stroke-linecap="round" />

    <!-- Bottom Counter-Arc 2 (Outer Cyan) -->
    <path d="M 104,72 C 104,106 76,114 48,114 C 20,114 6,98 6,78 C 6,54 30,44 52,36" 
          fill="none" stroke="#00F0FF" stroke-width="7" stroke-linecap="round" opacity="0.85" />

    <!-- Center Intercept Data Node -->
    <circle cx="64" cy="60" r="4.5" fill="#FFFFFF" />
  </g>

  <!-- Typography Lockup -->
  <text x="218" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="8" fill="#FFFFFF">
    STARTA
  </text>
  <text x="220" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="5.2" fill="#94A3B8">
    COMMUNICATION <tspan fill="#00F0FF">LTD</tspan>
  </text>
  
  <line x1="220" y1="130" x2="330" y2="130" stroke="#0062FF" stroke-width="2" />
</svg>
